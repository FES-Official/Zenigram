name: Zenigram Mobile CI

on:
  push:
    branches:
      - mobile/ios-android-conversion
    paths:
      - "mobile/**"
      - "src/app/api/mobile/**"
      - "src/app/lib/mobileAuth.js"
      - "src/app/lib/requestAuth.js"
      - "src/app/api/posts/**"
      - "src/app/api/feed-preferences/**"
      - "src/app/api/user/me/**"
      - "src/app/api/media/upload/**"
  pull_request:
    branches:
      - main
    paths:
      - "mobile/**"
      - "src/app/api/mobile/**"
      - "src/app/lib/mobileAuth.js"
      - "src/app/lib/requestAuth.js"
      - "src/app/api/posts/**"
      - "src/app/api/feed-preferences/**"
      - "src/app/api/user/me/**"
      - "src/app/api/media/upload/**"

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Bundle iOS and Android
        run: npx expo export --platform all --output-dir dist
